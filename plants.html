<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>植物图鉴 | CHO22植物设计</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 导航栏 -->
    <header>
        <div class="logo">
            <span class="logo-icon">🌿</span>
            <h1>CHO22</h1>
            <span class="logo-tagline">植物 · 设计 · 生活</span>
        </div>
        <nav>
            <a href="index.html">首页</a>
            <a href="plants.html" class="active">植物图鉴</a>
            <a href="services.html">服务</a>
            <a href="merchandise.html">纪念品</a>
            <a href="about.html">关于</a>
            <a href="contact.html">联系我们</a>
        </nav>
        <button class="menu-toggle" id="menuToggle">☰</button>
    </header>

    <!-- 页面主体 -->
    <main>
        <section class="page-header">
            <h1>🌿 植物图鉴</h1>
            <p>探索我们精选的植物品种</p>
        </section>

        <!-- 植物卡片网格 -->
        <section id="plantSection">
            <div id="plantList" class="plant-grid">
                <!-- 植物卡片由 JavaScript 动态生成 -->
            </div>
        </section>

        <!-- 添加植物表单 -->
        <section id="addSection" class="add-section">
            <h2>➕ 添加新植物</h2>
            <form id="addForm">
                <div class="form-group">
                    <input type="text" id="plantName" placeholder="植物名称" required>
                    <input type="text" id="plantDesc" placeholder="植物描述（选填）">
                </div>
                <button type="submit">添加植物</button>
            </form>
        </section>
    </main>

    <!-- 页脚 -->
    <footer>
        <div class="footer-content">
            <div>
                <h4>🌿 CHO22植物设计</h4>
                <p>让植物成为生活的一部分</p>
            </div>
            <div>
                <h4>联系方式</h4>
                <p>📧 hello@cho22plants.com</p>
                <p>📞 (02) 1234 5678</p>
                <p>📍 悉尼 · 植物园路 88 号</p>
            </div>
            <div>
                <h4>快速链接</h4>
                <a href="plants.html">植物图鉴</a>
                <a href="services.html">服务</a>
                <a href="contact.html">联系我们</a>
            </div>
        </div>
        <div class="footer-bottom">
            <p>&copy; 2026 CHO22植物设计公司. All rights reserved.</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
